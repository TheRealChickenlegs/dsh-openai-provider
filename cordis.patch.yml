# Mounts this plugin into the DSH profile's config tree (bundle declaration).
#
# Normally you do not edit this file. Configure providers from
#   DSH -> Plugins -> Plugins -> OpenAI Providers
# which writes only non-secret fields to this profile and stores API keys in the
# DSH credentials store ($DSH_HOME/.credentials.yaml, mode 0600).
#
# For headless / CI deployments the same non-secret fields may be written to
#   ~/.dsh-openai-provider/config.json
# or supplied as plugin config here:
#   - id: dsh-openai-provider
#     name: dsh-openai-provider
#     config:
#       providers:
#         - id: openai
#           baseUrl: https://api.openai.com/v1
#           apiKeyEnv: OPENAI_API_KEY
#           models:
#             - id: gpt-image-1
#               kind: image
# Never put an API key value in this file or in the profile: a provider's
# `apiKeyEnv` is the NAME of a credential stored by DSH, not the secret itself.
- insert:
    - id: dsh-openai-provider
      name: dsh-openai-provider
